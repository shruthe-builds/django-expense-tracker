<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4"><div class="container">
  <a class="navbar-brand" href="/">💰 Smart Expense Tracker</a>
  <div class="d-flex gap-2 align-items-center">
  {% if user.is_authenticated %}
    <span class="text-white me-2">Hi, {{ user.username }}</span>
    <a class="btn btn-outline-light btn-sm" href="{% url 'add' %}">Add Expense</a>
    <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
      <button class="btn btn-warning btn-sm">Logout</button></form>
  {% else %}
    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
    <a class="btn btn-success btn-sm" href="{% url 'signup' %}">Sign Up</a>
  {% endif %}
  </div></div></nav>
<div class="container">{% block body %}{% endblock %}</div>
</body></html>
