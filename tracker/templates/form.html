{% extends 'base.html' %}{% block body %}
<div class="card p-4 col-md-6 mx-auto"><h4>{{ title }}</h4>
<form method="post">{% csrf_token %}
  {% for f in form %}
    <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
      {% if f.help_text %}<small class="text-muted">{{ f.help_text }}</small>{% endif %}
      {% for err in f.errors %}<div class="text-danger">{{ err }}</div>{% endfor %}</div>
  {% endfor %}
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="/">Cancel</a>
</form></div>{% endblock %}
